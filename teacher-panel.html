<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة رصد المعلم v2026 - مشروع الخدمة</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --primary: #3b82f6; --success: #10b981; --sidebar: #1e293b; --danger: #ef4444; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; margin: 0; padding-bottom: 300px; overscroll-behavior-y: contain; }
        header { background: var(--sidebar); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .container { padding: 12px; max-width: 600px; margin: auto; }
        .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #e2e8f0; transition: 0.3s; }
        .active-row { border: 2px solid var(--primary); background: #eff6ff; transform: scale(1.02); }
        
        /* لوحة المفاتيح الذكية */
        .smart-keyboard { position: fixed; bottom: 20px; left: 10px; right: 10px; background: #e2e8f0; padding: 10px; display: none; gap: 6px; z-index: 2000; border-radius: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.2); border: 2px solid #94a3b8; }
        .key-btn { background: white; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 1px solid #94a3b8; height: 45px; transition: 0.1s; user-select: none; }
        .key-btn:active { background: var(--primary); color: white; transform: scale(0.95); }
        .key-all { background: #8b5cf6; color: white; font-size: 12px; }
        .key-done { background: var(--success); color: white; font-size: 14px; }
        .kb-max-30 { grid-template-columns: repeat(8, 1fr); }
        .kb-max-15 { grid-template-columns: repeat(5, 1fr); }

        .score-sel { width: 45px; height: 40px; font-weight: bold; text-align: center; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font-size: 16px; cursor: pointer; }
        .score-sel.active-input { border: 3px solid var(--primary); background: #fff; box-shadow: 0 0 10px rgba(59,130,246,0.3); }
        .score-sel.saved { border-color: var(--success); background: #f0fdf4; color: #15803d; }
        .score-sel.locked-item { background: #f1f5f9; cursor: not-allowed; opacity: 0.5; border-style: dashed; }
        
        .student-name { font-size: 13px; font-weight: 600; color: #334155; }
        .sync-status { position: fixed; bottom: 5px; right: 10px; font-size: 10px; color: #64748b; background: rgba(255,255,255,0.8); padding: 2px 5px; border-radius: 4px; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-weight: bold; margin-bottom: 10px; background: white; }
    </style>
</head>
<body>

<header>
    <div>👨‍🏫 <b id="tName">جاري التعرف...</b></div>
    <button id="closeBtn" onclick="closePad()" style="display:none; background:var(--danger); color:white; border:none; padding:6px 15px; border-radius:8px; font-weight:bold;">إغلاق اللوحة</button>
</header>

<div class="container">
    <div id="setupArea">
        <select id="vSubject" onchange="loadStudentsData()"><option value="">اختر المادة...</option></select>
        <select id="vClass" onchange="loadStudentsData()"><option value="">اختر الفصل...</option></select>
        <select id="vWeek" onchange="loadStudentsData()"><option value="">اختر الأسبوع...</option></select>
    </div>
    <div id="studentList"></div>
</div>

<div class="smart-keyboard" id="numPad"></div>
<div class="sync-status" id="syncStat">جاري الاتصال...</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8",
        authDomain: "rasd-tools.firebaseapp.com",
        projectId: "rasd-tools"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // تفعيل العمل أوفلاين
    db.enablePersistence().catch(err => console.log("Persistence failed"));

    const tId = sessionStorage.getItem('userEmail'); // سيتم جلبه من صفحة الدخول
    let currentStudents = [], activeInput = null, sysConfig = {}, teacherInfo = {};

    window.onload = async () => {
        if(!tId) return location.href="index.html";
        
        try {
            // جلب إعدادات الماستر والأقفال
            const confDoc = await db.collection('system').doc('config').get();
            sysConfig = confDoc.exists ? confDoc.data() : {};

            // جلب بيانات المعلم وفصوله
            const tDoc = await db.collection('teachers').doc(tId).get();
            if(tDoc.exists) {
                teacherInfo = tDoc.data();
                document.getElementById('tName').innerText = teacherInfo.name;
                
                // تعبئة المواد والفصول المسندة للمعلم فقط
                const subSel = document.getElementById('vSubject');
                teacherInfo.subjects.forEach(s => subSel.innerHTML += `<option value="${s}">${s}</option>`);
                
                const clsSel = document.getElementById('vClass');
                teacherInfo.classes.forEach(c => clsSel.innerHTML += `<option value="${c}">${c}</option>`);
            }

            // تعبئة الأسابيع والاختبارات بناءً على الأقفال المفتوحة فقط
            const weekSel = document.getElementById('vWeek');
            if(sysConfig.openWeeks) {
                sysConfig.openWeeks.forEach(w => {
                    const num = w.substring(1);
                    weekSel.innerHTML += `<option value="${w}">الأسبوع ${num}</option>`;
                });
            }
            if(sysConfig.openExams) {
                sysConfig.openExams.forEach(ex => {
                    const num = ex.substring(2);
                    weekSel.innerHTML += `<option value="${ex}">📝 اختبار الشهر ${num}</option>`;
                });
            }

            document.getElementById('syncStat').innerText = "✅ متصل";
        } catch (e) { document.getElementById('syncStat').innerText = "📡 وضع الأوفلاين"; }
    };

    async function loadStudentsData() {
        const sub = document.getElementById('vSubject').value;
        const cls = document.getElementById('vClass').value;
        const week = document.getElementById('vWeek').value;
        if(!sub || !cls || !week) return;

        document.getElementById('studentList').innerHTML = '<p style="text-align:center">جاري جلب قائمة الكنترول...</p>';

        // جلب الطلاب المربوطين بهذا الفصل بالترتيب الكنترولي
        const [gradeName, className] = cls.split(' - ');
        const sSnap = await db.collection('students')
                              .where('grade', '==', gradeName)
                              .where('class', '==', className)
                              .get();
        
        currentStudents = sSnap.docs.map(doc => ({id: doc.id, ...doc.data()}))
                                    .sort((a,b) => a.sortOrder - b.sortOrder);

        // جلب الدرجات المرصودة مسبقاً لهذا المعلم والمادة والأسبوع
        const gSnap = await db.collection('grades')
                              .where('teacher', '==', tId)
                              .where('week', '==', week)
                              .where('subject', '==', sub)
                              .get();
        
        const scores = {};
        gSnap.forEach(d => {
            const data = d.data();
            if(!scores[data.sid]) scores[data.sid] = {};
            scores[data.sid][data.type] = data.score;
        });

        renderList(scores, week);
    }

    function renderList(scores, week) {
        let html = '';
        currentStudents.forEach((s, idx) => {
            const sc = scores[s.id] || {};
            html += `<div class="card" id="row_${s.id}">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="student-name">${s.sortOrder}. ${s.name}</span>
                    <div style="display:flex; gap:5px;">`;

            if(week.startsWith('ex')) {
                html += drawInp(s.id, 'exam', sysConfig.maxExam, sc.exam, 'اختبار');
            } else {
                html += drawInp(s.id, 't', sysConfig.maxT, sc.t, 'ت');
                html += drawInp(s.id, 'v', sysConfig.maxV, sc.v, 'و');
                html += drawInp(s.id, 's', sysConfig.maxS, sc.s, 'س');
            }
            html += `</div></div></div>`;
        });
        document.getElementById('studentList').innerHTML = html || '<p style="text-align:center">لا يوجد طلاب في هذا الفصل</p>';
    }

    function drawInp(sid, type, max, cur, label) {
        return `<div style="text-align:center">
                    <small style="font-size:8px; display:block; color:#64748b">${label}</small>
                    <input type="text" readonly class="score-sel ${cur!==undefined?'saved':''}" 
                    id="inp_${sid}_${type}" value="${cur!==undefined?cur:''}" 
                    onclick="openPad('${sid}','${type}',${max})">
                </div>`;
    }

    function openPad(sid, type, max) {
        activeInput = {sid, type, max};
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active-row'));
        document.getElementById(`row_${sid}`).classList.add('active-row');
        document.querySelectorAll('.score-sel').forEach(i => i.classList.remove('active-input'));
        document.getElementById(`inp_${sid}_${type}`).classList.add('active-input');

        document.getElementById('setupArea').style.visibility = 'hidden';
        document.getElementById('closeBtn').style.display = 'block';

        const pad = document.getElementById('numPad');
        pad.style.display = 'grid';
        pad.className = `smart-keyboard ${max > 15 ? 'kb-max-30' : 'kb-max-15'}`;

        let keys = '';
        for(let i=1; i<=max; i++) keys += `<div class="key-btn" onclick="inputValue(${i})">${i}</div>`;
        keys += `<div class="key-btn" style="background:#f1f5f9" onclick="inputValue(0)">0</div>`;
        keys += `<div class="key-btn key-all" onclick="fillAllColumn()">الكل</div>`;
        keys += `<div class="key-btn key-done" style="grid-column: span 2" onclick="closePad()">تم ✅</div>`;
        pad.innerHTML = keys;

        const row = document.getElementById(`row_${sid}`);
        window.scrollTo({ top: row.offsetTop - 80, behavior: 'smooth' });
    }

    function inputValue(val) {
        if(!activeInput) return;
        const {sid, type} = activeInput;
        const inp = document.getElementById(`inp_${sid}_${type}`);
        inp.value = val; 
        inp.classList.add('saved');

        saveToFirebase(sid, type, val);
        autoNext();
    }

    function fillAllColumn() {
        if(!activeInput) return;
        const val = document.getElementById(`inp_${activeInput.sid}_${activeInput.type}`).value;
        if(val === "") return;
        currentStudents.forEach(s => {
            const target = document.getElementById(`inp_${s.id}_${activeInput.type}`);
            if(target) {
                target.value = val;
                target.classList.add('saved');
                saveToFirebase(s.id, activeInput.type, val);
            }
        });
    }

    function autoNext() {
        const week = document.getElementById('vWeek').value;
        const types = week.startsWith('ex') ? ['exam'] : ['t','v','s'];
        let nIdx = types.indexOf(activeInput.type) + 1;

        if(nIdx < types.length) {
            openPad(activeInput.sid, types[nIdx], sysConfig[`max${types[nIdx].toUpperCase()}`] || 15);
        } else {
            const curIdx = currentStudents.findIndex(s => s.id === activeInput.sid);
            if(curIdx < currentStudents.length - 1) {
                openPad(currentStudents[curIdx+1].id, types[0], sysConfig[`max${types[0].toUpperCase()}`] || 15);
            } else { closePad(); }
        }
    }

    async function saveToFirebase(sid, type, score) {
        const sub = document.getElementById('vSubject').value;
        const week = document.getElementById('vWeek').value;
        const docId = `${sid}_${week}_${type}_${sub}_${tId}`;
        
        try {
            await db.collection('grades').doc(docId).set({
                sid, week, type, subject: sub, score: parseInt(score), teacher: tId, timestamp: Date.now()
            }, {merge:true});
            document.getElementById('syncStat').innerText = "✅ تم الحفظ";
        } catch (e) { document.getElementById('syncStat').innerText = "⏳ بانتظار الإنترنت..."; }
    }

    function closePad() {
        document.getElementById('numPad').style.display = 'none';
        document.getElementById('setupArea').style.visibility = 'visible';
        document.getElementById('closeBtn').style.display = 'none';
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active-row'));
        document.querySelectorAll('.score-sel').forEach(i => i.classList.remove('active-input'));
    }
</script>
</body>
</html>
