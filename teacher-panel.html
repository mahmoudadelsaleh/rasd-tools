<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة رصد المعلم v2026 - التحديث الرقمي</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --primary: #3b82f6; --success: #10b981; --sidebar: #1e293b; --danger: #ef4444; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; margin: 0; padding-bottom: 300px; overscroll-behavior-y: contain; }
        header { background: var(--sidebar); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .container { padding: 12px; max-width: 600px; margin: auto; }
        .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #e2e8f0; transition: 0.3s; }
        .active-row { border: 2px solid var(--primary); background: #eff6ff; transform: scale(1.02); }
        .smart-keyboard { position: fixed; bottom: 20px; left: 10px; right: 10px; background: #e2e8f0; padding: 10px; display: none; grid-template-columns: repeat(5, 1fr); gap: 6px; z-index: 2000; border-radius: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.2); border: 2px solid #94a3b8; }
        .key-btn { background: white; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 1px solid #94a3b8; height: 45px; }
        .score-sel { width: 45px; height: 40px; font-weight: bold; text-align: center; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font-size: 16px; cursor: pointer; }
        .score-sel.active-input { border: 3px solid var(--primary); }
        .score-sel.saved { border-color: var(--success); background: #f0fdf4; color: #15803d; }
        .student-name { font-size: 13px; font-weight: 600; color: #334155; }
        .sync-status { position: fixed; bottom: 5px; right: 10px; font-size: 10px; color: #64748b; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <div>👨‍🏫 <b id="tName">جاري التحميل...</b></div>
    <button id="closeBtn" onclick="closePad()" style="display:none; background:var(--danger); color:white; border:none; padding:6px 15px; border-radius:8px; font-weight:bold;">إغلاق</button>
</header>

<div class="container">
    <div id="setupArea">
        <select id="vSubject" onchange="loadStudentsData()"><option value="">اختر المادة...</option></select>
        <select id="vClass" onchange="loadStudentsData()"><option value="">اختر الفصل...</option></select>
        <select id="vWeek" onchange="loadStudentsData()"><option value="">اختر الأسبوع...</option></select>
    </div>
    <div id="studentList"></div>
</div>

<div class="smart-keyboard" id="numPad"></div>
<div class="sync-status" id="syncStat">جاري الاتصال...</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8", projectId: "rasd-tools" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const tId = sessionStorage.getItem('userEmail');
    let currentStudents = [], activeInput = null, sysConfig = {}, teacherInfo = {};

    window.onload = async () => {
        if(!tId) return location.href="index.html";
        const confDoc = await db.collection('system').doc('config').get();
        sysConfig = confDoc.exists ? confDoc.data() : {};

        const tDoc = await db.collection('teachers').doc(tId).get();
        if(tDoc.exists) {
            teacherInfo = tDoc.data();
            document.getElementById('tName').innerText = teacherInfo.name;
            teacherInfo.subjects.forEach(s => document.getElementById('vSubject').innerHTML += `<option value="${s}">${s}</option>`);
            
            // هنا نربط فصول المعلم المختارة من الماستر
            teacherInfo.classes.forEach((c, index) => {
                // c هنا تكون مثل "الصف 1 - 1"
                document.getElementById('vClass').innerHTML += `<option value="${index}">${c}</option>`;
            });
        }

        const weekSel = document.getElementById('vWeek');
        if(sysConfig.openWeeks) sysConfig.openWeeks.forEach(w => weekSel.innerHTML += `<option value="${w}">أسبوع ${w.substring(1)}</option>`);
        if(sysConfig.openExams) sysConfig.openExams.forEach(ex => weekSel.innerHTML += `<option value="${ex}">اختبار شهر ${ex.substring(2)}</option>`);
    };

    async function loadStudentsData() {
        const sub = document.getElementById('vSubject').value;
        const clsIndex = document.getElementById('vClass').value;
        const week = document.getElementById('vWeek').value;
        if(!sub || clsIndex === "" || !week) return;

        document.getElementById('studentList').innerHTML = '<p style="text-align:center">جاري جلب القائمة...</p>';

        // تحويل الفصول إلى أرقام للبحث في الإكسيل المرفوع
        // مدرسة الماستر تعتمد: الصف الأول = 1، الفصل الأول = 1
        const fullClassName = teacherInfo.classes[clsIndex]; 
        // استخراج الأرقام من النص مثل "الصف 1 - 3" -> 1 و 3
        const numbers = fullClassName.match(/\d+/g);
        const gNum = parseInt(numbers[0]);
        const cNum = parseInt(numbers[1]);

        const sSnap = await db.collection('students')
                              .where('gradeNum', '==', gNum)
                              .where('classNum', '==', cNum)
                              .get();
        
        currentStudents = sSnap.docs.map(doc => ({id: doc.id, ...doc.data()}))
                                    .sort((a,b) => a.sortOrder - b.sortOrder);

        const gSnap = await db.collection('grades').where('teacher', '==', tId).where('week', '==', week).where('subject', '==', sub).get();
        const scores = {};
        gSnap.forEach(d => { const data = d.data(); if(!scores[data.sid]) scores[data.sid] = {}; scores[data.sid][data.type] = data.score; });

        renderList(scores, week);
    }

    function renderList(scores, week) {
        let html = '';
        currentStudents.forEach((s, idx) => {
            const sc = scores[s.id] || {};
            html += `<div class="card" id="row_${s.id}">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="student-name">${s.sortOrder}. ${s.name}</span>
                    <div style="display:flex; gap:5px;">`;
            if(week.startsWith('ex')) {
                html += drawInp(s.id, 'exam', sysConfig.maxExam, sc.exam, 'اختبار');
            } else {
                html += drawInp(s.id, 't', sysConfig.maxT, sc.t, 'ت');
                html += drawInp(s.id, 'v', sysConfig.maxV, sc.v, 'و');
                html += drawInp(s.id, 's', sysConfig.maxS, sc.s, 'س');
            }
            html += `</div></div></div>`;
        });
        document.getElementById('studentList').innerHTML = html || '<p style="text-align:center">لا يوجد طلاب مطابقين</p>';
    }

    function drawInp(sid, type, max, cur, label) {
        return `<div style="text-align:center"><small style="font-size:8px; display:block;">${label}</small>
        <input type="text" readonly class="score-sel ${cur!==undefined?'saved':''}" id="inp_${sid}_${type}" value="${cur!==undefined?cur:''}" onclick="openPad('${sid}','${type}',${max})"></div>`;
    }

    function openPad(sid, type, max) {
        activeInput = {sid, type, max};
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active-row'));
        document.getElementById(`row_${sid}`).classList.add('active-row');
        document.getElementById('setupArea').style.visibility = 'hidden';
        document.getElementById('closeBtn').style.display = 'block';
        const pad = document.getElementById('numPad');
        pad.style.display = 'grid';
        let keys = '';
        for(let i=1; i<=max; i++) keys += `<div class="key-btn" onclick="inputValue(${i})">${i}</div>`;
        keys += `<div class="key-btn" style="background:#f1f5f9" onclick="inputValue(0)">0</div>
                 <div class="key-btn" style="background:#8b5cf6; color:white; font-size:12px" onclick="fillAllColumn()">الكل</div>
                 <div class="key-btn" style="background:var(--success); color:white; grid-column:span 2" onclick="closePad()">تم</div>`;
        pad.innerHTML = keys;
        window.scrollTo({ top: document.getElementById(`row_${sid}`).offsetTop - 80, behavior: 'smooth' });
    }

    function inputValue(val) {
        if(!activeInput) return;
        const {sid, type} = activeInput;
        const inp = document.getElementById(`inp_${sid}_${type}`);
        inp.value = val; inp.classList.add('saved');
        saveToFirebase(sid, type, val);
        autoNext();
    }

    async function saveToFirebase(sid, type, score) {
        const sub = document.getElementById('vSubject').value;
        const week = document.getElementById('vWeek').value;
        await db.collection('grades').doc(`${sid}_${week}_${type}_${sub}`).set({
            sid, week, type, subject: sub, score: parseInt(score), teacher: tId, timestamp: Date.now()
        }, {merge:true});
        document.getElementById('syncStat').innerText = "✅ تم الحفظ";
    }

    function autoNext() {
        const week = document.getElementById('vWeek').value;
        const types = week.startsWith('ex') ? ['exam'] : ['t','v','s'];
        let nIdx = types.indexOf(activeInput.type) + 1;
        if(nIdx < types.length) {
            openPad(activeInput.sid, types[nIdx], sysConfig[`max${types[nIdx].toUpperCase()}`]);
        } else {
            const curIdx = currentStudents.findIndex(s => s.id === activeInput.sid);
            if(curIdx < currentStudents.length - 1) openPad(currentStudents[curIdx+1].id, types[0], sysConfig[`max${types[0].toUpperCase()}`]);
            else closePad();
        }
    }

    function closePad() {
        document.getElementById('numPad').style.display = 'none';
        document.getElementById('setupArea').style.visibility = 'visible';
        document.getElementById('closeBtn').style.display = 'none';
    }

    function fillAllColumn() {
        const val = document.getElementById(`inp_${activeInput.sid}_${activeInput.type}`).value;
        if(!val) return;
        currentStudents.forEach(s => {
            const target = document.getElementById(`inp_${s.id}_${activeInput.type}`);
            if(target) { target.value = val; target.classList.add('saved'); saveToFirebase(s.id, activeInput.type, val); }
        });
    }
</script>
</body>
</html>
