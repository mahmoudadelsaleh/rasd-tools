<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النتائج والتصدير</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; margin: 0; }
        .top-bar { background: var(--primary); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 15px; font-weight: bold; }
        .nav-links a.active { color: white; border-bottom: 2px solid var(--accent); }
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .controls { background: white; padding: 20px; border-radius: 12px; display: flex; gap: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; }
        th { background: #f8fafc; color: #475569; }
        .btn-exp { background: #0891b2; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="nav-links">
            <a href="school-setup.html">🏠 الإعدادات</a>
            <a href="manage-data.html">👥 الإدارة</a>
            <a href="results.html" class="active">📊 النتائج</a>
        </div>
        <div><span id="uName"></span> <button onclick="logout()" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">خروج</button></div>
    </div>

    <div class="container">
        <div class="controls">
            <select id="resGrade"><option value="">اختر الصف...</option></select>
            <button class="btn-exp" style="background:#3b82f6" onclick="fetchResults()">عرض البيانات</button>
            <button class="btn-exp" onclick="exportData()">تصدير Excel 📥</button>
        </div>
        <div style="overflow-x:auto;">
            <table id="resTable">
                <thead><tr id="hRow"><th>م</th><th>الاسم</th><th>الفصل</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8", projectId: "rasd-tools" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    window.onload = async () => {
        document.getElementById('uName').innerText = sessionStorage.getItem('userName');
        const conf = await db.collection('system').doc('config').get();
        if(conf.exists) {
            conf.data().grades.forEach(g => document.getElementById('resGrade').innerHTML += `<option value="${g.name}">${g.name}</option>`);
        }
    };

    async function fetchResults() {
        const grade = document.getElementById('resGrade').value;
        const gNum = grade.match(/\d+/)[0];
        const sSnap = await db.collection('students').get();
        const students = sSnap.docs.map(d => ({id:d.id, ...d.data()})).filter(s => s.classCode.startsWith(gNum + '/')).sort((a,b) => a.sortOrder - b.sortOrder);
        
        const gSnap = await db.collection('grades').get();
        const grades = gSnap.docs.map(d => d.data());
        
        const subjects = [...new Set(grades.map(g => g.subject))];
        const hRow = document.getElementById('hRow');
        hRow.innerHTML = `<th>م</th><th>الاسم</th><th>الفصل</th>` + subjects.map(s => `<th>${s} (ت)</th><th>${s} (و)</th>`).join('');
        
        const tbody = document.querySelector('#resTable tbody');
        tbody.innerHTML = students.map(s => {
            let cols = `<td>${s.sortOrder}</td><td style="text-align:right">${s.name}</td><td>${s.classCode}</td>`;
            subjects.forEach(sub => {
                const scT = grades.find(g => g.sid === s.id && g.subject === sub && g.type === 't')?.score || '-';
                const scV = grades.find(g => g.sid === s.id && g.subject === sub && g.type === 'v')?.score || '-';
                cols += `<td>${scT}</td><td>${scV}</td>`;
            });
            return `<tr>${cols}</tr>`;
        }).join('');
    }

    function exportData() {
        const ws = XLSX.utils.table_to_sheet(document.getElementById('resTable'));
        ws['!views'] = [{RTL: true}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "النتائج");
        XLSX.writeFile(wb, `نتائج_الطلاب_${new Date().toLocaleDateString()}.xlsx`);
    }

    function logout() { sessionStorage.clear(); window.location.href="index.html"; }
</script>
</body>
</html>
