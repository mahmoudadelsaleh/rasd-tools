<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results | Management</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --navy: #0a192f; --gold: #c5a059; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; margin: 0; padding-bottom: 30px; }
        .nav-header { background: var(--navy); color: white; padding: 15px; border-bottom: 3px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 13px; font-weight: bold; margin-left: 10px; }
        .nav-links a.active { color: var(--gold); }
        .container { padding: 10px; }
        .filter-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; font-size: 16px; }
        .btn-act { width: 100%; padding: 12px; background: var(--navy); color: var(--gold); border: none; border-radius: 8px; font-weight: bold; margin-bottom: 5px; cursor: pointer; }
        .table-wrap { background: white; border-radius: 12px; overflow-x: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 600px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
        th { background: #f1f5f9; color: var(--navy); }
    </style>
</head>
<body>
    <div class="nav-header">
        <div class="nav-links">
            <a href="school-setup.html">🏠 الإعدادات</a>
            <a href="manage-data.html">👥 الإدارة</a>
            <a href="results.html" class="active">📊 النتائج</a>
        </div>
        <button onclick="logout()" style="background:transparent; color:var(--gold); border:1px solid var(--gold); padding:4px 10px; border-radius:5px; font-size:12px;">خروج</button>
    </div>

    <div class="container">
        <div class="filter-box">
            <select id="selGrade"><option value="">اختر الصف الدراسي...</option></select>
            <button class="btn-act" onclick="loadResults()">عرض الكشف 🔍</button>
            <button class="btn-act" style="background:#065f46; color:white;" onclick="exportExcel()">تصدير Excel 📥</button>
        </div>
        <div class="table-wrap">
            <table id="tblRes">
                <thead><tr id="hRow"><th>م</th><th>الاسم</th><th>الفصل</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8", projectId: "rasd-tools" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    window.onload = async () => {
        const doc = await db.collection('system').doc('config').get();
        if(doc.exists) {
            doc.data().grades.forEach(g => document.getElementById('selGrade').innerHTML += `<option value="${g.name}">${g.name}</option>`);
        }
    };

    async function loadResults() {
        const grade = document.getElementById('selGrade').value;
        if(!grade) return;
        const gNum = grade.match(/\d+/)[0];
        const studentsSnap = await db.collection('students').get();
        const students = studentsSnap.docs.map(d => ({id: d.id, ...d.data()})).filter(s => s.classCode.startsWith(gNum + '/')).sort((a,b) => a.sortOrder - b.sortOrder);
        
        const gradesSnap = await db.collection('grades').get();
        const grades = gradesSnap.docs.map(d => d.data());
        const subjects = [...new Set(grades.map(g => g.subject))];
        
        const hRow = document.getElementById('hRow');
        hRow.innerHTML = `<th>م</th><th>الاسم</th><th>الفصل</th>` + subjects.map(s => `<th>${s}</th>`).join('');
        
        const tbody = document.querySelector('#tblRes tbody');
        tbody.innerHTML = students.map(s => {
            let row = `<td>${s.sortOrder}</td><td style="text-align:right">${s.name}</td><td>${s.classCode}</td>`;
            subjects.forEach(sub => {
                const total = grades.filter(g => g.sid === s.id && g.subject === sub).reduce((acc, curr) => acc + curr.score, 0);
                row += `<td>${total || 0}</td>`;
            });
            return `<tr>${row}</tr>`;
        }).join('');
    }

    function exportExcel() {
        const ws = XLSX.utils.table_to_sheet(document.getElementById('tblRes'));
        ws['!views'] = [{RTL: true}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "النتائج");
        XLSX.writeFile(wb, `Report_${new Date().getTime()}.xlsx`);
    }
    function logout() { sessionStorage.clear(); window.location.href="index.html"; }
</script>
</body>
</html>
