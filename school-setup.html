<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات النظام | مدرسة الخدمة الثانوية</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --navy: #0a192f; --gold: #c5a059; --bg: #f1f5f9; --success: #10b981; --danger: #ef4444; --blue: #3b82f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding-bottom: 100px; }

        /* Nav Mobile */
        .nav-header { background: var(--navy); color: white; padding: 15px; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .nav-links { display: flex; gap: 10px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 13px; font-weight: bold; padding: 8px 12px; border-radius: 8px; transition: 0.3s; }
        .nav-links a.active { background: var(--gold); color: var(--navy); }

        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-right: 5px solid var(--gold); }
        .card h3 { margin-top: 0; font-size: 17px; color: var(--navy); border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        /* ستايل مراقبة المعلمين */
        .monitor-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #f1f5f9; }
        .prog-bg { flex-grow: 1; background: #e2e8f0; height: 12px; border-radius: 6px; margin: 0 15px; overflow: hidden; position: relative; }
        .prog-fill { height: 100%; background: linear-gradient(90deg, var(--success), #34d399); transition: width 1s ease-in-out; }
        .percent-text { font-size: 11px; font-weight: bold; width: 45px; text-align: left; }

        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { font-size: 12px; font-weight: bold; color: #64748b; display: block; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; box-sizing: border-box; }

        .lock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 10px; }
        .lock-btn { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; font-size: 12px; display: flex; align-items: center; gap: 5px; font-weight: bold; cursor: pointer; }
        .lock-btn input { width: auto; }

        .save-bar { position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); display: flex; justify-content: center; z-index: 1000; }
        .btn-main { width: 100%; max-width: 400px; padding: 15px; background: var(--navy); color: var(--gold); border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        .status-badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; color: white; }
    </style>
</head>
<body>
    <div class="nav-header">
        <div class="nav-links">
            <a href="school-setup.html" class="active">🏠 الإعدادات</a>
            <a href="manage-data.html">👥 الإدارة</a>
            <a href="results.html">📊 النتائج</a>
        </div>
        <button onclick="logout()" style="background:transparent; color:var(--gold); border:1px solid var(--gold); padding:4px 10px; border-radius:5px; font-size:12px;">خروج</button>
    </div>

    <div class="container">
        <div class="card">
            <h3>📊 مراقبة إنجاز المعلمين (نسبة الرصد الفعلي)</h3>
            <div id="teachersMonitor" style="max-height: 300px; overflow-y: auto;">
                <p style="text-align:center; font-size:12px; color:#64748b;">جاري جرد المعلمين وتحليل البيانات...</p>
            </div>
            <button onclick="refreshMonitor()" style="margin-top:10px; background:var(--gold); border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:11px;">تحديث لوحة الإنجاز 🔄</button>
        </div>

        <div class="card">
            <h3>🏗️ الهيكل الأكاديمي آلياً</h3>
            <label>رفع ملف الطلاب والفصول (Excel):</label>
            <input type="file" id="up_excel" accept=".xlsx, .xls" onchange="readStructure(event)">
            <p id="up_msg" style="font-size:12px; color:var(--success); margin-top:8px; font-weight:bold;"></p>
        </div>

        <div class="card">
            <h3>🏫 هوية المؤسسة</h3>
            <label>اسم المدرسة:</label>
            <input type="text" id="sch_name" value="مدرسة الخدمة الثانوية العامة المشتركة">
            <label>بيان شؤون الطلاب (رسالة تظهر للطلاب في صفحة النتيجة):</label>
            <textarea id="sch_control" rows="2"></textarea>
        </div>

        <div class="card">
            <h3>📊 موازين الدرجات (الحد الأقصى للرصد)</h3>
            <div class="grid-inputs">
                <div><label>التقييم (ت):</label><input type="number" id="max_t"></div>
                <div><label>الواجب (و):</label><input type="number" id="max_v"></div>
                <div><label>السلوك (س):</label><input type="number" id="max_s"></div>
                <div><label>الاختبار:</label><input type="number" id="max_exam"></div>
            </div>
        </div>

        <div class="card">
            <h3>🔐 إدارة الأقفال (تحكم في النشر والرصد)</h3>
            <label>بوابة النتائج للطلاب:</label>
            <select id="show_res">
                <option value="false">🔒 محجوبة (وضع المراجعة)</option>
                <option value="true">🔓 منشورة (متاحة للطلاب)</option>
            </select>
            
            <label style="margin-top:15px">الأسابيع المفتوحة للرصد:</label>
            <div id="w_locks" class="lock-grid"></div>
            
            <label style="margin-top:15px">الاختبارات المفتوحة للرصد:</label>
            <div id="e_locks" class="lock-grid"></div>
        </div>
    </div>

    <div class="save-bar">
        <button class="btn-main" onclick="saveAll()">حفظ واعتماد التغييرات الشاملة 💾</button>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8", projectId: "rasd-tools" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let currentData = {}, newGrades = [];

    window.onload = async () => {
        const doc = await db.collection('system').doc('config').get();
        if(doc.exists) {
            currentData = doc.data();
            document.getElementById('sch_name').value = currentData.schoolName || 'مدرسة الخدمة الثانوية العامة المشتركة';
            document.getElementById('sch_control').value = currentData.controlWord || '';
            document.getElementById('max_t').value = currentData.maxT || 5;
            document.getElementById('max_v').value = currentData.maxV || 5;
            document.getElementById('max_s').value = currentData.maxS || 5;
            document.getElementById('max_exam').value = currentData.maxExam || 20;
            document.getElementById('show_res').value = currentData.showResults ? "true" : "false";
            renderLocksUI();
            refreshMonitor();
        }
    };

    function renderLocksUI() {
        const wCont = document.getElementById('w_locks');
        const eCont = document.getElementById('e_locks');
        wCont.innerHTML = ''; eCont.innerHTML = '';
        for(let i=1; i<=14; i++) {
            const chk = (currentData.openWeeks && currentData.openWeeks.includes(`w${i}`)) ? 'checked' : '';
            wCont.innerHTML += `<label class="lock-btn"><input type="checkbox" value="w${i}" ${chk}> أسبوع ${i}</label>`;
        }
        for(let i=1; i<=3; i++) {
            const chk = (currentData.openExams && currentData.openExams.includes(`ex${i}`)) ? 'checked' : '';
            let label = i === 3 ? "نهائي" : `اختبار ${i}`;
            eCont.innerHTML += `<label class="lock-btn"><input type="checkbox" value="ex${i}" ${chk}> ${label}</label>`;
        }
    }

    async function refreshMonitor() {
        const monitor = document.getElementById('teachersMonitor');
        try {
            const tSnap = await db.collection('teachers').get();
            const gSnap = await db.collection('grades').get();
            
            let html = '';
            tSnap.forEach(tDoc => {
                const teacher = tDoc.data();
                const tEmail = tDoc.id;
                
                // جلب درجات هذا المعلم فقط
                const teacherGrades = gSnap.docs.filter(g => g.data().teacher === tEmail);
                
                // حساب الطلاب الفريدين الذين تم رصدهم
                const distinctStudents = new Set(teacherGrades.map(g => g.data().sid)).size;
                
                // حساب النسبة (بناءً على عدد فصول المعلم × 40 طالب كمتوسط)
                const totalExpected = (teacher.classes ? teacher.classes.length : 1) * 40;
                const percent = Math.min(100, Math.round((distinctStudents / totalExpected) * 100));
                
                html += `
                <div class="monitor-row">
                    <div style="width:140px; font-size:12px;"><b>${teacher.name}</b><br><small>${tEmail}</small></div>
                    <div class="prog-bg">
                        <div class="prog-fill" style="width:${percent}%"></div>
                    </div>
                    <div class="percent-text">${percent}%</div>
                </div>`;
            });
            monitor.innerHTML = html || "لا يوجد معلمون مسجلون.";
        } catch (e) {
            monitor.innerHTML = "خطأ في تحميل بيانات الإنجاز.";
        }
    }

    function readStructure(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const data = new Uint8Array(event.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
            const map = {};
            json.slice(1).forEach(r => { if(r[2] && r[3]) {
                const g = `الصف ${r[2]}`;
                if(!map[g]) map[g] = new Set();
                map[g].add(`${r[2]}/${r[3]}`);
            }});
            newGrades = Object.keys(map).map(g => ({ name: g, classes: Array.from(map[g]).map(c => ({name: c})) }));
            document.getElementById('up_msg').innerText = "✅ تم استخراج الهيكل بنجاح من الملف";
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    }

    async function saveAll() {
        const config = {
            schoolName: document.getElementById('sch_name').value,
            controlWord: document.getElementById('sch_control').value,
            maxT: parseInt(document.getElementById('max_t').value),
            maxV: parseInt(document.getElementById('max_v').value),
            maxS: parseInt(document.getElementById('max_s').value),
            maxExam: parseInt(document.getElementById('max_exam').value),
            showResults: document.getElementById('show_res').value === "true",
            openWeeks: Array.from(document.querySelectorAll('#w_locks input:checked')).map(i => i.value),
            openExams: Array.from(document.querySelectorAll('#e_locks input:checked')).map(i => i.value),
            grades: newGrades.length > 0 ? newGrades : (currentData.grades || [])
        };
        await db.collection('system').doc('config').set(config, {merge:true});
        alert("🏛️ مدرسة الخدمة الثانوية: تم حفظ كافة الإعدادات بنجاح");
        location.reload();
    }
    function logout() { sessionStorage.clear(); window.location.href="index.html"; }
</script>
</body>
</html>
