<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات النظام الذكي - الماستر v2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1e293b; --accent: #3b82f6; --success: #10b981; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .setup-panel { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .section-title { border-right: 5px solid var(--accent); padding-right: 15px; margin-bottom: 20px; color: var(--primary); font-size: 1.2rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #f8fafc; box-sizing: border-box; }
        .excel-upload-box { border: 2px dashed var(--accent); padding: 30px; text-align: center; border-radius: 15px; background: #f0f7ff; cursor: pointer; margin-bottom: 20px; }
        .btn-save { background: var(--success); color: white; border: none; padding: 18px; border-radius: 12px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); padding: 10px; display: flex; justify-content: center; z-index: 2000; }
        .nav-link { background: var(--accent); color: white; padding: 10px 25px; border-radius: 30px; text-decoration: none; font-weight: bold; }
        .grade-tag { display: inline-block; background: #e2e8f0; padding: 5px 12px; border-radius: 20px; margin: 5px; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <h2>🛡️ إعداد الماستر من ملف الطلاب</h2>
</header>

<div class="container">
    <div class="setup-panel">
        <h3 class="section-title">1. استخراج هيكل المدرسة من الإكسيل</h3>
        <p style="font-size: 13px; color: #64748b;">ارفع ملف الطلاب، وسيقوم النظام بتحديد الصفوف والفصول تلقائياً بناءً على البيانات.</p>
        <div class="excel-upload-box" onclick="document.getElementById('setup_excel').click()">
            <p id="file_info">📁 اضغط لرفع شيت الطلاب (Excel)</p>
            <input type="file" id="setup_excel" hidden accept=".xlsx, .xls" onchange="analyzeExcel(event)">
        </div>
        <div id="analysis_result" style="display:none;">
            <h4>الصفوف والفصول المكتشفة:</h4>
            <div id="tags_area"></div>
        </div>
    </div>

    <div class="setup-panel">
        <h3 class="section-title">2. البيانات الرسمية</h3>
        <div class="form-group">
            <label>اسم المدرسة:</label>
            <input type="text" id="sch_name">
        </div>
        <div class="form-group">
            <label>كلمة مدير المدرسة:</label>
            <textarea id="sch_principal" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label>كلمة رئيس الكنترول:</label>
            <textarea id="sch_control" rows="2"></textarea>
        </div>
    </div>

    <div class="setup-panel">
        <h3 class="section-title">3. معايير الرصد والأقفال</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>عدد أسابيع الرصد:</label>
                <input type="number" id="weeks_count" value="14">
            </div>
            <div class="form-group">
                <label>أقصى درجة للتقييم (ت):</label>
                <input type="number" id="max_t" value="15">
            </div>
        </div>
        <button class="btn-save" onclick="finalSave()">اعتماد الهيكل وحفظ الإعدادات 💾</button>
    </div>
</div>

<div class="bottom-nav">
    <a href="manage-data.html" class="nav-link">الخطوة التالية: إدارة المعلمين والطلاب ⬅️</a>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8", projectId: "rasd-tools" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let detectedGrades = [];

    async function analyzeExcel(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
            const data = new Uint8Array(event.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
            
            const rows = json.slice(1);
            const structure = {};

            rows.forEach(r => {
                if(r[2] && r[3]) {
                    const g = `الصف ${r[2]}`;
                    const c = `${r[2]}/${r[3]}`;
                    if(!structure[g]) structure[g] = new Set();
                    structure[g].add(c);
                }
            });

            detectedGrades = Object.keys(structure).map(gName => ({
                name: gName,
                classes: Array.from(structure[gName]).sort().map(cName => ({ name: cName, students: 0 }))
            }));

            renderAnalysis();
        };
        reader.readAsArrayBuffer(file);
    }

    function renderAnalysis() {
        const area = document.getElementById('tags_area');
        area.innerHTML = '';
        detectedGrades.forEach(g => {
            let clsText = g.classes.map(c => c.name).join(' , ');
            area.innerHTML += `<div style="margin-bottom:10px;"><b>${g.name}:</b> <span class="grade-tag">${clsText}</span></div>`;
        });
        document.getElementById('analysis_result').style.display = 'block';
        document.getElementById('file_info').innerText = "✅ تم استخراج الهيكل بنجاح";
    }

    async function finalSave() {
        if(detectedGrades.length === 0) return alert("يرجى رفع ملف الطلاب أولاً لاستخراج الهيكل");

        const config = {
            schoolName: document.getElementById('sch_name').value,
            principalWord: document.getElementById('sch_principal').value,
            controlWord: document.getElementById('sch_control').value,
            weeksCount: parseInt(document.getElementById('weeks_count').value),
            maxT: parseInt(document.getElementById('max_t').value),
            grades: detectedGrades,
            openWeeks: ["w1"], // فتح الأسبوع الأول افتراضياً
            updatedAt: Date.now()
        };

        try {
            await db.collection('system').doc('config').set(config);
            alert("✅ تم اعتماد هيكل المدرسة بنجاح بناءً على ملف الطلاب");
        } catch(e) { alert("❌ خطأ في الحفظ"); }
    }
</script>
</body>
</html>
