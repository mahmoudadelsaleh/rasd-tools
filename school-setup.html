<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - الماستر</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        .top-bar { background: var(--primary); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 15px; font-weight: bold; }
        .nav-links a.active { color: white; border-bottom: 2px solid var(--accent); }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 5px; box-sizing: border-box; }
        .btn-save { width: 100%; padding: 15px; background: #10b981; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .lock-box { background: #f8fafc; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="nav-links">
            <a href="school-setup.html" class="active">🏠 الإعدادات</a>
            <a href="manage-data.html">👥 الإدارة</a>
            <a href="results.html">📊 النتائج</a>
        </div>
        <div><span id="uName"></span> <button onclick="logout()" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">خروج</button></div>
    </div>

    <div class="container">
        <div class="card">
            <h3>🏗️ استخراج الهيكل من الإكسيل</h3>
            <input type="file" id="master_excel" accept=".xlsx, .xls" onchange="analyzeStructure(event)">
            <div id="analysis_res" style="margin-top:15px; color: #1e40af; font-weight: bold;"></div>
        </div>

        <div class="card">
            <h3>🏫 بيانات المدرسة</h3>
            <input type="text" id="sch_name" placeholder="اسم المدرسة">
            <textarea id="sch_control" placeholder="رسالة الكنترول للطلاب"></textarea>
        </div>

        <div class="card">
            <h3>📊 حدود الدرجات النهائية</h3>
            <div class="grid">
                <div>ت (أقصى درجة): <input type="number" id="max_t" value="15"></div>
                <div>و (أقصى درجة): <input type="number" id="max_v" value="15"></div>
                <div>س (أقصى درجة): <input type="number" id="max_s" value="10"></div>
                <div>اختبار (أقصى درجة): <input type="number" id="max_exam" value="30"></div>
            </div>
        </div>

        <div class="card">
            <h3>🔐 الأقفال والنتائج</h3>
            <select id="show_results_toggle">
                <option value="false">🔒 حجب النتائج عن الطلاب</option>
                <option value="true">🔓 إتاحة النتائج للاستعلام</option>
            </select>
            <h4 style="margin-top:20px;">الأسابيع المفتوحة للرصد:</h4>
            <div id="weeks_grid" class="grid"></div>
        </div>

        <button class="btn-save" onclick="saveConfig()">حفظ كافة الإعدادات والاعتماد 💾</button>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8", projectId: "rasd-tools" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let detectedStructure = [], currentConfig = {};

    window.onload = async () => {
        document.getElementById('uName').innerText = sessionStorage.getItem('userName');
        const doc = await db.collection('system').doc('config').get();
        if(doc.exists) {
            currentConfig = doc.data();
            document.getElementById('sch_name').value = currentConfig.schoolName || '';
            document.getElementById('sch_control').value = currentConfig.controlWord || '';
            document.getElementById('max_t').value = currentConfig.maxT || 15;
            document.getElementById('max_v').value = currentConfig.maxV || 15;
            document.getElementById('max_s').value = currentConfig.maxS || 10;
            document.getElementById('max_exam').value = currentConfig.maxExam || 30;
            document.getElementById('show_results_toggle').value = currentConfig.showResults ? "true" : "false";
            renderLocks();
        }
    };

    function analyzeStructure(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const data = new Uint8Array(event.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
            const map = {};
            json.slice(1).forEach(r => {
                if(r[2] && r[3]) {
                    const g = `الصف ${r[2]}`;
                    if(!map[g]) map[g] = new Set();
                    map[g].add(`${r[2]}/${r[3]}`);
                }
            });
            detectedStructure = Object.keys(map).map(g => ({ name: g, classes: Array.from(map[g]).map(c => ({name: c})) }));
            document.getElementById('analysis_res').innerText = "✅ تم استخراج الهيكل بنجاح";
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    }

    function renderLocks() {
        const cont = document.getElementById('weeks_grid');
        cont.innerHTML = '';
        for(let i=1; i<=14; i++) {
            const checked = (currentConfig.openWeeks && currentConfig.openWeeks.includes(`w${i}`)) ? 'checked' : '';
            cont.innerHTML += `<div class="lock-box"><input type="checkbox" value="w${i}" ${checked}> أسبوع ${i}</div>`;
        }
    }

    async function saveConfig() {
        const config = {
            schoolName: document.getElementById('sch_name').value,
            controlWord: document.getElementById('sch_control').value,
            maxT: parseInt(document.getElementById('max_t').value),
            maxV: parseInt(document.getElementById('max_v').value),
            maxS: parseInt(document.getElementById('max_s').value),
            maxExam: parseInt(document.getElementById('max_exam').value),
            showResults: document.getElementById('show_results_toggle').value === "true",
            openWeeks: Array.from(document.querySelectorAll('#weeks_grid input:checked')).map(i => i.value),
            grades: detectedStructure.length > 0 ? detectedStructure : currentConfig.grades
        };
        await db.collection('system').doc('config').set(config, {merge:true});
        alert("✅ تم الحفظ!"); location.reload();
    }

    function logout() { if(confirm("خروج؟")) { sessionStorage.clear(); window.location.href="index.html"; } }
</script>
</body>
</html>
