<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام النتائج - نظام الخدمة 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --bg: #f1f5f9; --gold: #c5a059; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { background: var(--primary); color: white; width: 100%; padding: 25px 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-bottom: 4px solid var(--gold); }
        .search-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 450px; margin-top: -30px; z-index: 100; border: 1px solid #e2e8f0; }
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 18px; text-align: center; box-sizing: border-box; font-weight: bold; }
        .btn-search { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.3s; }
        .btn-search:active { transform: scale(0.95); }
        
        .result-area { width: 90%; max-width: 600px; margin-top: 20px; display: none; }
        .student-info { background: var(--primary); color: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; text-align: center; border-right: 8px solid var(--gold); }
        
        /* Subject Table Style */
        .report-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .report-table th { background: #e2e8f0; color: #1e293b; padding: 12px 8px; font-size: 13px; }
        .report-table td { padding: 12px 8px; text-align: center; border-bottom: 1px solid #f1f5f9; font-size: 14px; font-weight: 500; }
        .sub-name { text-align: right !important; font-weight: bold; color: var(--primary); }
        .absent-badge { background: #fee2e2; color: #dc2626; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
        
        .locked-msg { background: #fee2e2; color: #991b1b; padding: 25px; border-radius: 15px; text-align: center; border: 1px solid #fecaca; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <h2 id="schName">نظام الرصد الذكي</h2>
    <p>بوابة استعلام نتائج الطلاب v2026</p>
</header>

<div class="search-card">
    <label style="font-weight: bold; color: #475569;">ادخل كود الطالب الموحد:</label>
    <input type="number" id="studentId" placeholder="مثال: 45">
    <button class="btn-search" onclick="checkResult()">استخراج النتيجة 📊</button>
</div>

<div id="statusArea" class="result-area"></div>
<div id="resultsContent" class="result-area"></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8", projectId: "rasd-tools" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function checkResult() {
        const sId = parseInt(document.getElementById('studentId').value);
        const resContent = document.getElementById('resultsContent');
        const statArea = document.getElementById('statusArea');

        if(!sId) return alert("يرجى كتابة الكود الخاص بك");

        // 1. التحقق من إتاحة النتائج
        const conf = await db.collection('system').doc('config').get();
        const config = conf.data();
        document.getElementById('schName').innerText = config.schoolName || "نظام الرصد الذكي";

        if(config.showResults === false) {
            statArea.innerHTML = `<div class="locked-msg">
                <h3>🚫 النتائج محجوبة حالياً</h3>
                <p>${config.controlWord || 'عذراً، النتائج قيد المراجعة والتدقيق حالياً.'}</p>
            </div>`;
            statArea.style.display = 'block'; resContent.style.display = 'none'; return;
        }

        // 2. البحث عن الطالب
        const sSnap = await db.collection('students').where('sortOrder', '==', sId).get();
        if(sSnap.empty) return alert("الكود غير موجود، تأكد من الرقم الصحيح");

        const student = sSnap.docs[0].data();
        const studentUID = sSnap.docs[0].id;

        // 3. جلب كل الدرجات والغياب
        const gSnap = await db.collection('grades').where('sid', '==', studentUID).get();
        
        // معالجة البيانات وتجميعها حسب المادة
        let subjectsReport = {};

        gSnap.forEach(doc => {
            const g = doc.data();
            if(!subjectsReport[g.subject]) {
                subjectsReport[g.subject] = { t:[], v:[], s:[], absCount: 0 };
            }

            if(g.type === 't') subjectsReport[g.subject].t.push(g.score);
            else if(g.type === 'v') subjectsReport[g.subject].v.push(g.score);
            else if(g.type === 's') subjectsReport[g.subject].s.push(g.score);
            else if(g.type === 'attendance') {
                subjectsReport[g.subject].absCount += (g.days ? g.days.length : 0);
            }
        });

        // عرض بيانات الطالب الأساسية
        statArea.innerHTML = `<div class="student-info">
            <div style="font-size:18px; font-weight:bold;">${student.name}</div>
            <div style="font-size:13px; color:var(--gold)">${student.classCode}</div>
        </div>`;
        statArea.style.display = 'block';

        // بناء جدول النتائج
        let html = `
        <table class="report-table">
            <thead>
                <tr>
                    <th style="text-align:right">المادة</th>
                    <th>تقييم</th>
                    <th>واجب</th>
                    <th>سلوك</th>
                    <th>غياب</th>
                </tr>
            </thead>
            <tbody>`;

        for (const sub in subjectsReport) {
            const data = subjectsReport[sub];
            const avg = (arr) => arr.length > 0 ? (arr.reduce((a,b)=>a+b, 0) / arr.length).toFixed(1) : '-';
            
            html += `
                <tr>
                    <td class="sub-name">${sub}</td>
                    <td style="color:var(--accent); font-weight:bold;">${avg(data.t)}</td>
                    <td>${avg(data.v)}</td>
                    <td>${avg(data.s)}</td>
                    <td><span class="${data.absCount > 0 ? 'absent-badge' : ''}">${data.absCount || 0}</span></td>
                </tr>`;
        }

        html += `</tbody></table>
        <p style="font-size:11px; text-align:center; color:#64748b;">* الأرقام المعروضة هي متوسط ما تم رصده لك خلال الأسابيع الماضية.</p>`;

        resContent.innerHTML = html;
        resContent.style.display = 'block';
    }
</script>
</body>
</html>
