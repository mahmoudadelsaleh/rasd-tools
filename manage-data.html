<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Management Center | Pro v2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --navy: #0a192f; --gold: #c5a059; --bg: #f8fafc; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding-bottom: 30px; }
        .nav-header { background: var(--navy); color: white; padding: 15px; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 13px; font-weight: bold; padding: 6px 10px; margin-left: 5px; }
        .nav-links a.active { background: var(--gold); color: var(--navy); border-radius: 5px; }
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: var(--white); border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-right: 5px solid var(--gold); }
        input, select { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 12px; box-sizing: border-box; }
        .btn-prime { width: 100%; padding: 16px; background: var(--navy); color: var(--gold); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .table-wrap { width: 100%; overflow-x: auto; background: white; border-radius: 10px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        th, td { border-bottom: 1px solid #f1f5f9; padding: 15px; text-align: center; }
        .whatsapp-btn { color: #25d366; font-size: 18px; cursor: pointer; text-decoration: none; }
        .edit-icon { color: var(--navy); cursor: pointer; margin-left: 10px; }
        .panel { display: none; } .panel.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="nav-header">
        <div class="nav-links">
            <a href="school-setup.html">🏠 الإعدادات</a>
            <a href="manage-data.html" class="active">👥 الإدارة</a>
            <a href="results.html">📊 النتائج</a>
        </div>
        <button onclick="logout()" style="background:transparent; color:var(--gold); border:1px solid var(--gold); padding:5px 10px; border-radius:8px;">خروج</button>
    </div>

    <div class="container">
        <div class="card">
            <h3 id="fTitle">🏢 إدارة شؤون المعلمين</h3>
            <input type="text" id="t_name" placeholder="اسم المعلم الرباعي">
            <input type="text" id="t_user" placeholder="اسم المستخدم (Username)">
            <input type="text" id="t_pass" placeholder="كلمة المرور">
            <input type="text" id="t_phone" placeholder="رقم الموبايل (مثال: 01552402912)">
            <input type="text" id="t_subs" placeholder="المواد الدراسية">
            <div id="cls_checks" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; padding:10px; background:#f8fafc;"></div>
            <button class="btn-prime" style="margin-top:15px;" onclick="saveTeacher()">حفظ واعتماد البيانات 💾</button>
            <button id="cancelEdit" style="display:none; width:100%; margin-top:5px; background:#64748b; color:white; border:none; padding:10px; border-radius:8px;" onclick="resetForm()">إلغاء التعديل</button>
        </div>

        <div class="card" style="padding:10px;">
            <h3>📋 سجل هيئة التدريس</h3>
            <div class="table-wrap">
                <table id="tTable">
                    <thead><tr><th>المعلم</th><th>بيانات الدخول</th><th>تواصل</th><th>إجراء</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8", projectId: "rasd-tools" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // ضع هنا رابط موقعك المخصص سواء كان على Firebase أو Domain خاص
    const PLATFORM_URL = window.location.origin; 

    window.onload = async () => {
        const conf = await db.collection('system').doc('config').get();
        if(conf.exists) {
            const cont = document.getElementById('cls_checks');
            conf.data().grades.forEach(g => g.classes.forEach(c => {
                cont.innerHTML += `<label style="font-size:12px;"><input type="checkbox" name="t_cls" value="${g.name} - ${c.name}"> ${g.name} - ${c.name}</label>`;
            }));
        }
        renderTeachers();
    };

    async function saveTeacher() {
        const user = document.getElementById('t_user').value.trim();
        const name = document.getElementById('t_name').value.trim();
        const pass = document.getElementById('t_pass').value.trim();
        const phone = document.getElementById('t_phone').value.trim();
        const subs = document.getElementById('t_subs').value.split(',');
        const clss = Array.from(document.querySelectorAll('input[name="t_cls"]:checked')).map(c => c.value);

        if(!user || !name) return alert("الاسم والمستخدم حقول إجبارية");

        await db.collection('teachers').doc(user).set({
            name, pass, phone, subjects: subs, classes: clss, updatedAt: Date.now()
        }, {merge:true});
        
        alert("✅ تم تحديث بيانات المعلم");
        resetForm(); renderTeachers();
    }

    async function renderTeachers() {
        const snap = await db.collection('teachers').get();
        const tbody = document.querySelector('#tTable tbody');
        tbody.innerHTML = '';
        snap.forEach(doc => {
            const t = doc.data();
            // تجهيز نص رسالة الواتساب
            const msg = window.encodeURIComponent(`أهلاً بك يا ${t.name} في منصة الرصد الذكي v2026 🏛️\n\nبيانات دخولك هي:\nاسم المستخدم: ${doc.id}\nكلمة المرور: ${t.pass}\n\nرابط المنصة:\n${PLATFORM_URL}\n\nبالتوفيق في رصدك!`);
            const waLink = t.phone ? `https://wa.me/2${t.phone}?text=${msg}` : '#';

            tbody.innerHTML += `
                <tr>
                    <td><b>${t.name}</b></td>
                    <td>U: ${doc.id}<br>P: ${t.pass}</td>
                    <td>
                        <a href="${waLink}" target="_blank" class="whatsapp-btn"><i class="fab fa-whatsapp"></i></a>
                    </td>
                    <td>
                        <i class="fas fa-edit edit-icon" onclick="editT('${doc.id}')"></i>
                        <i class="fas fa-trash" style="color:red; cursor:pointer;" onclick="delT('${doc.id}')"></i>
                    </td>
                </tr>`;
        });
    }

    async function editT(id) {
        const doc = await db.collection('teachers').doc(id).get();
        const t = doc.data();
        document.getElementById('t_user').value = id; document.getElementById('t_user').disabled = true;
        document.getElementById('t_name').value = t.name;
        document.getElementById('t_pass').value = t.pass;
        document.getElementById('t_phone').value = t.phone || '';
        document.getElementById('t_subs').value = t.subjects.join(',');
        document.querySelectorAll('input[name="t_cls"]').forEach(cb => cb.checked = t.classes.includes(cb.value));
        document.getElementById('fTitle').innerText = "✏️ تعديل بيانات المعلم";
        document.getElementById('cancelEdit').style.display = 'block';
        window.scrollTo(0,0);
    }

    function resetForm() {
        document.getElementById('t_user').value = ''; document.getElementById('t_user').disabled = false;
        document.getElementById('t_name').value = ''; document.getElementById('t_pass').value = '';
        document.getElementById('t_phone').value = ''; document.getElementById('t_subs').value = '';
        document.querySelectorAll('input[name="t_cls"]').forEach(cb => cb.checked = false);
        document.getElementById('fTitle').innerText = "إضافة معلم جديد";
        document.getElementById('cancelEdit').style.display = 'none';
    }

    async function delT(id) { if(confirm("حذف نهائي؟")) { await db.collection('teachers').doc(id).delete(); renderTeachers(); } }
    function logout() { sessionStorage.clear(); window.location.href="index.html"; }
</script>
</body>
</html>
