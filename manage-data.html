<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة البيانات - نظام الخدمة v2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --success: #10b981; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 1000px; margin: 15px auto; padding: 0 10px; }
        .panel { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; width: 100%; transition: 0.2s; }
        .btn-add { background: var(--accent); }
        .excel-zone { border: 2px dashed var(--accent); padding: 30px; text-align: center; border-radius: 15px; background: #f0f7ff; cursor: pointer; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #f8fafc; }
    </style>
</head>
<body>

<header>
    <h2>⚙️ إدارة المعلمين والطلاب (النظام الرقمي)</h2>
</header>

<div class="container">
    <div class="panel">
        <h3>👨‍🏫 إضافة معلم وتعديله</h3>
        <input type="text" id="t_name" placeholder="اسم المعلم">
        <input type="text" id="t_user" placeholder="اسم المستخدم">
        <input type="text" id="t_pass" placeholder="كلمة المرور">
        <input type="text" id="t_subjects" placeholder="المواد (مثال: رياضيات, دين)">
        <div id="classes_check" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:10px; background:#f1f5f9; padding:15px; border-radius:10px; margin-bottom:10px;"></div>
        <button class="btn btn-add" onclick="saveTeacher()">حفظ بيانات المعلم 💾</button>
    </div>

    <div class="panel">
        <h3>🎓 استيراد شيت الطلاب (الترتيب الكنترولي)</h3>
        <div class="excel-zone" onclick="document.getElementById('excel_file').click()">
            <p id="file_status">📁 اضغط لرفع شيت الإكسيل</p>
            <input type="file" id="excel_file" hidden accept=".xlsx, .xls" onchange="handleExcel(event)">
        </div>
        <div id="previewArea" style="display:none;">
            <button class="btn" style="background:var(--success)" onclick="uploadStudents()">اعتماد ورفع الطلاب لفايربيز 🚀</button>
            <table id="previewTable">
                <thead><tr><th>م</th><th>الاسم</th><th>الصف</th><th>الفصل</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8", projectId: "rasd-tools" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let schoolConfig = null, excelData = [];

    async function init() {
        const conf = await db.collection('system').doc('config').get();
        if(conf.exists) {
            schoolConfig = conf.data();
            const container = document.getElementById('classes_check');
            schoolConfig.grades.forEach(g => {
                g.classes.forEach(c => {
                    const val = `${g.name} - ${c.name}`;
                    container.innerHTML += `<label style="font-size:11px;"><input type="checkbox" name="t_cls" value="${val}"> ${val}</label>`;
                });
            });
        }
    }

    async function saveTeacher() {
        const user = document.getElementById('t_user').value.trim();
        const name = document.getElementById('t_name').value.trim();
        const pass = document.getElementById('t_pass').value.trim();
        const subjects = document.getElementById('t_subjects').value.split(',').map(s => s.trim());
        const classes = Array.from(document.querySelectorAll('input[name="t_cls"]:checked')).map(c => c.value);
        if(!user || !name) return alert("أكمل البيانات");
        await db.collection('teachers').doc(user).set({ name, pass, subjects, classes, role: 'teacher' }, {merge:true});
        alert("✅ تم الحفظ");
    }

    function handleExcel(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const data = new Uint8Array(event.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
            // الترتيب حسب صورتك: 0:مسلسل | 1:الاسم | 2:الصف | 3:الفصل
            excelData = json.slice(1).map(r => ({
                sortOrder: parseInt(r[0]), name: r[1], gradeNum: parseInt(r[2]), classNum: parseInt(r[3])
            })).filter(r => r.name);
            renderPreview();
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    }

    function renderPreview() {
        document.getElementById('previewArea').style.display = 'block';
        const tbody = document.querySelector('#previewTable tbody');
        tbody.innerHTML = excelData.map(r => `<tr><td>${r.sortOrder}</td><td style="text-align:right">${r.name}</td><td>${r.gradeNum}</td><td>${r.classNum}</td></tr>`).join('');
    }

    async function uploadStudents() {
        if(!confirm("سيتم استبدال الطلاب، هل أنت متأكد؟")) return;
        const old = await db.collection('students').get();
        let batch = db.batch();
        old.forEach(d => batch.delete(d.ref));
        await batch.commit();

        batch = db.batch();
        let count = 0;
        for (let s of excelData) {
            batch.set(db.collection('students').doc(), s);
            count++;
            if(count === 400) { await batch.commit(); batch = db.batch(); count = 0; }
        }
        await batch.commit();
        alert("✅ تمت العملية بنجاح!");
    }

    window.onload = init;
</script>
</body>
</html>
