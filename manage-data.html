<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة البيانات المطور v2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 1000px; margin: 15px auto; padding: 0 10px; }
        .panel { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; width: 100%; transition: 0.2s; }
        .btn-add { background: var(--accent); }
        .btn-cancel { background: #64748b; margin-top: 5px; }
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; font-size: 13px; }
        th { background: #f8fafc; color: #475569; }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; background: #f1f5f9; }
        .online { background: #dcfce7; color: #166534; }
        .action-btn { padding: 5px 10px; border-radius: 6px; border: none; color: white; cursor: pointer; font-size: 11px; margin: 0 2px; }
        .edit-btn { background: var(--warning); }
        .del-btn { background: var(--danger); }
    </style>
</head>
<body>

<header>
    <h2>⚙️ لوحة تحكم الماستر v2026</h2>
</header>

<div class="container">
    <div class="panel">
        <h3 id="formTitle">👨‍🏫 إضافة / تعديل معلم</h3>
        <input type="text" id="t_name" placeholder="اسم المعلم">
        <input type="text" id="t_user" placeholder="اسم المستخدم">
        <input type="text" id="t_pass" placeholder="كلمة المرور">
        <input type="text" id="t_subjects" placeholder="المواد (فصل بينها بفاصلة)">
        <div id="classes_check" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:10px; background:#f1f5f9; padding:15px; border-radius:10px; margin-bottom:10px;"></div>
        <button class="btn btn-add" id="mainSaveBtn" onclick="saveTeacher()">حفظ بيانات المعلم 💾</button>
        <button class="btn btn-cancel" id="cancelBtn" onclick="resetForm()" style="display:none;">إلغاء التعديل</button>
    </div>

    <div class="panel">
        <h3>📋 سجل المعلمين والنشاط (Log)</h3>
        <div class="table-container">
            <table id="teachersTable">
                <thead>
                    <tr>
                        <th>المعلم</th>
                        <th>المستخدم / المرور</th>
                        <th>المواد</th>
                        <th>آخر ظهور</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8", projectId: "rasd-tools" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let isEditing = false;

    window.onload = async () => {
        await loadConfig();
        await loadTeachers();
    };

    async function loadConfig() {
        const conf = await db.collection('system').doc('config').get();
        if(conf.exists) {
            const data = conf.data();
            const container = document.getElementById('classes_check');
            container.innerHTML = '';
            data.grades.forEach(g => {
                g.classes.forEach(c => {
                    const val = `${g.name} - ${c.name}`;
                    container.innerHTML += `<label style="font-size:11px; display:flex; gap:5px;"><input type="checkbox" name="t_cls" value="${val}"> ${val}</label>`;
                });
            });
        }
    }

    async function loadTeachers() {
        const tbody = document.querySelector('#teachersTable tbody');
        tbody.innerHTML = '<tr><td colspan="5">⏳ جاري تحميل البيانات...</td></tr>';
        
        try {
            const snap = await db.collection('teachers').get();
            tbody.innerHTML = '';
            snap.forEach(doc => {
                const t = doc.data();
                const lastLogin = t.lastLogin ? new Date(t.lastLogin).toLocaleString('ar-EG') : 'لم يدخل بعد';
                tbody.innerHTML += `
                    <tr>
                        <td><b>${t.name}</b></td>
                        <td>U: ${doc.id}<br>P: ${t.pass}</td>
                        <td>${t.subjects ? t.subjects.join(', ') : '-'}</td>
                        <td><span class="status-badge ${t.lastLogin ? 'online' : ''}">${lastLogin}</span></td>
                        <td>
                            <button class="action-btn edit-btn" onclick="editTeacher('${doc.id}')">تعديل</button>
                            <button class="action-btn del-btn" onclick="deleteTeacher('${doc.id}')">حذف</button>
                        </td>
                    </tr>`;
            });
        } catch (e) { tbody.innerHTML = '<tr><td colspan="5">❌ فشل تحميل البيانات</td></tr>'; }
    }

    async function saveTeacher() {
        const user = document.getElementById('t_user').value.trim();
        const name = document.getElementById('t_name').value.trim();
        const pass = document.getElementById('t_pass').value.trim();
        const subs = document.getElementById('t_subjects').value.split(',').map(s => s.trim());
        const clss = Array.from(document.querySelectorAll('input[name="t_cls"]:checked')).map(c => c.value);

        if(!user || !name || !pass) return alert("يرجى إكمال البيانات الأساسية");

        await db.collection('teachers').doc(user).set({
            name, pass, subjects: subs, classes: clss, role: 'teacher', updatedAt: Date.now()
        }, {merge: true});

        alert("✅ تم الحفظ بنجاح");
        resetForm();
        loadTeachers();
    }

    async function editTeacher(id) {
        const doc = await db.collection('teachers').doc(id).get();
        const t = doc.data();
        
        document.getElementById('t_user').value = id;
        document.getElementById('t_user').disabled = true;
        document.getElementById('t_name').value = t.name;
        document.getElementById('t_pass').value = t.pass;
        document.getElementById('t_subjects').value = t.subjects ? t.subjects.join(', ') : '';
        
        document.querySelectorAll('input[name="t_cls"]').forEach(cb => {
            cb.checked = t.classes && t.classes.includes(cb.value);
        });

        document.getElementById('formTitle').innerText = "✏️ تعديل بيانات: " + t.name;
        document.getElementById('mainSaveBtn').innerText = "تحديث البيانات 🔄";
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function resetForm() {
        document.getElementById('t_user').value = '';
        document.getElementById('t_user').disabled = false;
        document.getElementById('t_name').value = '';
        document.getElementById('t_pass').value = '';
        document.getElementById('t_subjects').value = '';
        document.querySelectorAll('input[name="t_cls"]').forEach(cb => cb.checked = false);
        document.getElementById('formTitle').innerText = "👨‍🏫 إضافة / تعديل معلم";
        document.getElementById('mainSaveBtn').innerText = "حفظ بيانات المعلم 💾";
        document.getElementById('cancelBtn').style.display = 'none';
    }

    async function deleteTeacher(id) {
        if(confirm("هل أنت متأكد من حذف هذا المعلم نهائياً؟")) {
            await db.collection('teachers').doc(id).delete();
            loadTeachers();
        }
    }
</script>
</body>
</html>
