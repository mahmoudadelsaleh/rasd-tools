<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academic Portal | Secured Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --navy: #0a192f; --gold: #c5a059; --white: #ffffff; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #f4f7f9; margin: 0; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; 
        }
        .login-wrap { 
            width: 92%; max-width: 400px; background: var(--white); 
            border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            padding: 45px 25px; text-align: center; border-top: 6px solid var(--gold); 
        }
        .brand-logo { font-size: 28px; font-weight: 800; color: var(--navy); margin-bottom: 30px; }
        .brand-logo span { color: var(--gold); }
        input { 
            width: 100%; padding: 15px; margin-bottom: 15px; 
            border: 1px solid #e2e8f0; border-radius: 12px; 
            font-size: 16px; box-sizing: border-box; transition: 0.3s; 
        }
        input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(197,160,89,0.1); }
        button { 
            width: 100%; padding: 16px; background: var(--navy); 
            color: var(--gold); border: none; border-radius: 12px; 
            font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s;
        }
        button:active { transform: scale(0.98); }
        .welcome-ov { display: none; font-size: 22px; font-weight: bold; color: var(--navy); animation: fadeIn 0.5s; }
        #msg { color: #b91c1c; margin-top: 15px; font-size: 14px; font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="login-wrap">
        <div id="login_ui">
            <div class="brand-logo">UNIVERSITY<span>HUB</span></div>
            <p style="font-size: 13px; color: #64748b; margin-top: -20px; margin-bottom: 25px;">منظومة الرصد والكنترول v2026</p>
            
            <input type="text" id="user" placeholder="اسم المستخدم">
            <input type="password" id="pass" placeholder="كلمة المرور">
            
            <button onclick="handleLogin()">دخول المنصة الأكاديمية 🏛️</button>
            <p id="msg"></p>
        </div>
        <div id="welcome_ui" class="welcome-ov"></div>
    </div>

<script>
    // إعدادات فايربيز الخاصة بك
    const firebaseConfig = { 
        apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8", 
        projectId: "rasd-tools" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function handleLogin() {
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value.trim();
        const msg = document.getElementById('msg');
        
        if(!u || !p) {
            msg.innerText = "⚠️ يرجى إدخال البيانات كاملة";
            return;
        }

        msg.innerText = "⏳ جاري التحقق من الهوية...";
        sessionStorage.clear(); // تنظيف أي جلسات سابقة فوراً

        try {
            // 1. فحص مجموعة المديرين (Admins)
            const adminDoc = await db.collection('admins').doc(u).get();
            
            if(adminDoc.exists && adminDoc.data().pass === p) {
                const adminData = adminDoc.data();
                // تخزين البيانات في الجلسة
                sessionStorage.setItem('userEmail', u);
                sessionStorage.setItem('userName', adminData.name);
                sessionStorage.setItem('userRole', adminData.role || 'super_admin');
                
                loginSuccess("school-setup.html", adminData.name);
                return;
            } 

            // 2. إذا لم يكن مديراً، فحص مجموعة المعلمين (Teachers)
            const teacherDoc = await db.collection('teachers').doc(u).get();
            if(teacherDoc.exists && teacherDoc.data().pass === p) {
                const tData = teacherDoc.data();
                sessionStorage.setItem('userEmail', u);
                sessionStorage.setItem('userName', tData.name);
                sessionStorage.setItem('userRole', 'teacher');
                
                loginSuccess("teacher-panel.html", tData.name);
                return;
            }

            // 3. في حال فشل كل المحاولات
            msg.innerText = "❌ اسم المستخدم أو كلمة المرور غير صحيحة";

        } catch (error) {
            console.error("Login Error:", error);
            msg.innerText = "📡 حدث خطأ في الاتصال بالقاعدة.. جرب ثانية";
        }
    }

    function loginSuccess(target, name) {
        document.getElementById('login_ui').style.display = 'none';
        const w = document.getElementById('welcome_ui');
        w.innerHTML = `👋 مرحباً بك<br><span style="color:var(--gold)">${name}</span>`;
        w.style.display = 'block';
        
        // التوجيه التلقائي بعد 1.2 ثانية
        setTimeout(() => window.location.href = target, 1200);
    }
</script>
</body>
</html>
