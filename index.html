<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الماستر - نظام الخدمة 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2563eb; }
        .error { color: #ef4444; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🔐 دخول الماستر</h2>
    <p>نظام الرصد الذكي v2.0</p>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول النظام</button>
    <div id="errMsg" class="error">بيانات الدخول غير صحيحة!</div>
</div>

<script>
    // إعدادات فايربيز الخاصة بك (rasd-tools)
    const firebaseConfig = {
        apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8",
        authDomain: "rasd-tools.firebaseapp.com",
        projectId: "rasd-tools"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const errMsg = document.getElementById('errMsg');

        // التحقق من بيانات الماستر التي طلبتها
        if (user === "almas2021" && pass === "790707071") {
            sessionStorage.setItem('isAdmin', 'true');
            sessionStorage.setItem('role', 'super_admin');
            
            // تخزين بيانات المدير في فايربيز للتأكد من وجودها دائماً
            await db.collection('admins').doc('master').set({
                username: user,
                role: 'super_admin',
                lastLogin: new Date()
            });

            window.location.href = "school-setup.html"; // التوجه لصفحة الإعدادات
        } else {
            errMsg.style.display = 'block';
        }
    }
</script>
</body>
</html>
