<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدرسة الخدمة الثانوية العامة | تسجيل دخول</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a192f">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --navy: #0a192f; --gold: #c5a059; --white: #ffffff; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #f4f7f9; margin: 0; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; 
        }
        .login-wrap { 
            width: 92%; max-width: 400px; background: var(--white); 
            border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            padding: 45px 25px; text-align: center; border-top: 6px solid var(--gold); 
        }
        .brand-logo { font-size: 24px; font-weight: 800; color: var(--navy); margin-bottom: 30px; line-height: 1.4; }
        .brand-logo span { color: var(--gold); display: block; font-size: 16px; margin-top: 5px; }
        input { 
            width: 100%; padding: 15px; margin-bottom: 15px; 
            border: 1px solid #e2e8f0; border-radius: 12px; 
            font-size: 16px; box-sizing: border-box; transition: 0.3s; text-align: center;
        }
        input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(197,160,89,0.1); }
        button { 
            width: 100%; padding: 16px; background: var(--navy); 
            color: var(--gold); border: none; border-radius: 12px; 
            font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s;
        }
        button:active { transform: scale(0.98); }
        .welcome-ov { display: none; font-size: 22px; font-weight: bold; color: var(--navy); animation: fadeIn 0.5s; }
        #msg { color: #b91c1c; margin-top: 15px; font-size: 14px; font-weight: bold; min-height: 20px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="login-wrap">
        <div id="login_ui">
            <div class="brand-logo">مدرسة الخدمة الثانوية العامة<span>منظومة الرصد والكنترول v2026</span></div>

            <input type="text" id="user" placeholder="اسم المستخدم">
            <input type="password" id="pass" placeholder="كلمة المرور">

            <button onclick="handleLogin()">دخول المنصة الأكاديمية 🏛️</button>
            <p id="msg"></p>
        </div>
        <div id="welcome_ui" class="welcome-ov"></div>
    </div>

<script>
    // إعدادات فايربيز
    const firebaseConfig = { 
        apiKey: "AIzaSyBePGZiqMPmZQdg36jZ4Rkdtd7OISxmob8", 
        projectId: "rasd-tools" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function handleLogin() {
        const uInput = document.getElementById('user').value.trim();
        const pInput = document.getElementById('pass').value.trim();
        const msg = document.getElementById('msg');

        if(!uInput || !pInput) {
            msg.innerText = "⚠️ يرجى إدخال البيانات كاملة";
            return;
        }

        msg.innerText = "⏳ جاري التحقق من الهوية...";
        sessionStorage.clear();

        try {
            const adminQuery = await db.collection('admins').where('username', '==', uInput).get();

            if(!adminQuery.empty) {
                const adminData = adminQuery.docs[0].data();
                if(adminData.pass && adminData.pass === pInput) {
                    sessionStorage.setItem('userEmail', uInput);
                    sessionStorage.setItem('userName', adminData.name);
                    sessionStorage.setItem('userRole', adminData.role || 'super_admin');
                    loginSuccess("school-setup.html", adminData.name);
                    return;
                }
            } 

            const teacherDoc = await db.collection('teachers').doc(uInput).get();
            if(teacherDoc.exists) {
                const tData = teacherDoc.data();
                if(tData.pass === pInput) {
                    sessionStorage.setItem('userEmail', uInput);
                    sessionStorage.setItem('userName', tData.name);
                    sessionStorage.setItem('userRole', 'teacher');
                    loginSuccess("teacher-panel.html", tData.name);
                    return;
                }
            }

            msg.innerText = "❌ اسم المستخدم أو كلمة المرور غير صحيحة";

        } catch (error) {
            console.error("Login Error:", error);
            msg.innerText = "📡 فشل الاتصال بالخادم";
        }
    }

    function loginSuccess(target, name) {
        document.getElementById('login_ui').style.display = 'none';
        const w = document.getElementById('welcome_ui');
        w.innerHTML = `👋 مرحباً بك<br><span style="color:var(--gold)">${name}</span>`;
        w.style.display = 'block';
        setTimeout(() => window.location.href = target, 1200);
    }

    // تسجيل الـ Service Worker لتحويل الموقع لتطبيق
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Active'))
                .catch(err => console.log('PWA Error', err));
        });
    }
</script>
</body>
</html>
